apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
react { autolinkLibrariesWithApp() }
android {
 namespace 'com.tuturno.flujo'
 compileSdk rootProject.ext.compileSdkVersion
 buildToolsVersion rootProject.ext.buildToolsVersion
 ndkVersion rootProject.ext.ndkVersion
 defaultConfig {
  applicationId 'com.tuturno.flujo.v20'
  minSdk 26
  targetSdk 36
  versionCode 200003
  versionName '20.0.3'
 }
 signingConfigs {
  debug {
   if (System.getenv('TUTURNO_REVIEW_KEYSTORE')) storeFile file(System.getenv('TUTURNO_REVIEW_KEYSTORE'))
  }
 }
 buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
}
dependencies {
 implementation('com.facebook.react:react-android')
 implementation('com.facebook.react:hermes-android')
 implementation('com.facebook.fresco:animated-webp:3.6.0')
 implementation('com.facebook.fresco:webpsupport:3.6.0')
}
